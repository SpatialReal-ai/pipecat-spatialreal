[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipecat-spatialreal"
dynamic = ["version"]
description = "Pipecat processor that drives a SpatialReal avatar from a voice bot's TTS audio"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
# pipecat-ai dropped Python 3.10 in 1.0.0; every release this package can depend on needs >=3.11.
requires-python = ">=3.11"
authors = [{ name = "SpatialReal", email = "hello@spatialreal.com" }]
keywords = ["pipecat", "avatar", "voice-agent", "realtime", "spatialreal"]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    "pipecat-ai>=1.15.0,<2",
    "spatialreal>=0.2.2,<0.3",
    # The generated code is stamped 6.31.1; an older runtime refuses to import it.
    "protobuf>=6.31.1,<8",
]

[project.optional-dependencies]
# grpcio-tools is pinned: it decides the gencode protobuf version, and the generated code refuses
# to import under an older protobuf runtime. That version must stay <= the `protobuf>=` floor in
# `dependencies` (pipecat-ai and spatialreal both allow 6.x), so bump the two together.
dev = [
    # pytest-asyncio 1.1 is the first to cancel the tasks a test leaves running when its loop ends;
    # under 1.0 they are finalised inside a later test, whose teardown then fails. It needs pytest
    # 8.2 or newer.
    "pytest>=8.2",
    "pytest-asyncio>=1.1",
    "pytest-timeout>=2.3",
    "pytest-aiohttp",
    "aiohttp>=3.9",
    "websockets>=12",
    "grpcio-tools==1.75.1",
    "ruff",
    # Pipecat's eval transport, which tests/test_rtvi_smoke.py sends through, is its FastAPI
    # WebSocket transport.
    "pipecat-ai[websocket]>=1.15.0,<2",
]
example = [
    "pipecat-ai[daily,livekit,runner,silero,deepgram,cartesia,openai]>=1.15.0",
    "python-dotenv>=1.0",
]

[project.urls]
Documentation = "https://docs.spatialreal.ai"
Website = "https://www.spatialreal.ai/"
Source = "https://github.com/SpatialReal-ai/pipecat-spatialreal"

[tool.hatch.version]
path = "src/pipecat_spatialreal/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pipecat_spatialreal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A test that hangs (a pipeline whose EndFrame never gets through, say) ends the run after two
# minutes instead of holding CI until the job's timeout; the slowest test takes a few seconds.
# The thread method dumps every stack and stops the run. The signal method cannot end such a test:
# it fails it, and the teardown then waits forever on the pipeline's tasks.
timeout = 120
timeout_method = "thread"
filterwarnings = [
    # pipecat-ai imports the stdlib audioop, deprecated on Python 3.11 and 3.12 (it uses
    # audioop-lts from 3.13 on). Not ours to fix; nothing else is ignored.
    "ignore:'audioop' is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/pipecat_spatialreal/proto/generated"]
