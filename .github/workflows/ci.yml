name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A run takes about two minutes; a hung one is cut off here instead of at GitHub's six hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor (pipecat-ai >= 1.0 requires it); 3.12 is what the codegen workflow runs.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}

      # tests/probe_check.mjs runs the probe page's analysis under Node, so the test that calls it
      # needs one; the runner image's own Node is not something to count on.
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # The example extra brings FastAPI and the Pipecat runner, which the token-route tests of
      # examples/bot.py import: without it they are skipped.
      - name: Install (dev and example extras)
        run: uv sync --extra dev --extra example

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

      - name: Build
        run: uv build
