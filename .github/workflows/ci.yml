name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor (pipecat-ai >= 1.0 requires it); 3.12 is what the codegen workflow runs.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}

      # The example extra brings FastAPI and the Pipecat runner, which the token-route tests of
      # examples/bot.py import: without it they are skipped.
      - name: Install (dev and example extras)
        run: uv sync --extra dev --extra example

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

      - name: Build
        run: uv build
