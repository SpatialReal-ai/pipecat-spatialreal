name: Pipecat compatibility

# Once a week, runs the tests against the newest pipecat-ai that pyproject.toml allows, to learn
# early when a Pipecat release breaks this package.
#
# When the tests fail, the job fails and the run is the report: nothing is changed. When they pass
# on a release newer than the one the README says the package was tested with ("Tested with Pipecat
# vX.Y.Z"), a second job opens a pull request that moves that line.
#
# The two jobs are kept apart because the first runs freshly resolved third-party code (the newest
# Pipecat and whatever it pulls in). It holds a read-only token and nothing else; its checkout does
# not keep even that. The second holds the write token and runs no dependency code: it checks out
# the repository without keeping the token, edits one line of the README itself, and the pull
# request can carry README.md and nothing else.
#
# The pull request is opened with the workflow's own token, so GitHub starts no other workflow on
# it. The repository setting "Allow GitHub Actions to create and approve pull requests" must be on.
#
# workflow_dispatch only finds workflows that are on the default branch.

on:
  schedule:
    - cron: "23 6 * * 1" # Mondays, 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A run takes a few minutes; a hung one is cut off here instead of at GitHub's six hours.
    timeout-minutes: 15
    # The job's token, which setup-uv also receives by default (its github-token input), can only
    # read.
    permissions:
      contents: read
    outputs:
      installed: ${{ steps.version.outputs.installed }}
      bump: ${{ steps.version.outputs.bump }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      # tests/probe_check.mjs runs the probe page's analysis under Node.
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # Libraries resolve fresh here (uv.lock is not committed), and --upgrade-package makes the
      # newest pipecat-ai win even when a lock file has been restored from somewhere. Resolving
      # again, rather than upgrading the installed package alone, keeps the dependencies of the
      # extras in step with the new release.
      - name: Install the newest Pipecat that pyproject.toml allows
        run: uv sync --extra dev --extra example --upgrade-package pipecat-ai

      # The suite includes tests/test_rtvi_smoke.py, which sends the avatar messages through RTVI
      # and Pipecat's eval transport.
      - name: Test
        run: uv run pytest -q

      - name: Compare with the README
        id: version
        run: |
          installed="$(uv run python -c 'import importlib.metadata as m; print(m.version("pipecat-ai"))')"
          stated="$(grep -oE 'Tested with Pipecat v[0-9]+(\.[0-9]+)*' README.md | head -n 1 | sed 's/^.* v//')"
          if [ -z "$stated" ]; then
            echo "README.md has no 'Tested with Pipecat vX.Y.Z' line" >&2
            exit 1
          fi
          echo "The README says v${stated}; the tests passed on v${installed}."
          newest="$(printf '%s\n%s\n' "$stated" "$installed" | sort -V | tail -n 1)"
          {
            echo "installed=${installed}"
            if [ "$installed" != "$stated" ] && [ "$newest" = "$installed" ]; then
              echo "bump=true"
            else
              echo "bump=false"
            fi
          } >> "$GITHUB_OUTPUT"

  pr:
    needs: check
    if: needs.check.outputs.bump == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The version comes from the job that ran third-party code, so it is checked before it is
      # used anywhere, and it goes through env, not into the script text.
      - name: Move the README to the tested version
        env:
          INSTALLED: ${{ needs.check.outputs.installed }}
        run: |
          if ! [[ "$INSTALLED" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Not a release version: '${INSTALLED}'" >&2
            exit 1
          fi
          sed -E "s/Tested with Pipecat v[0-9]+(\.[0-9]+)*/Tested with Pipecat v${INSTALLED}/" README.md > README.md.new
          mv README.md.new README.md
          git diff --stat

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          # Only the README goes into the pull request, whatever else is in the working tree.
          add-paths: README.md
          branch: compat/pipecat-${{ needs.check.outputs.installed }}
          delete-branch: true
          commit-message: "docs: tested with Pipecat v${{ needs.check.outputs.installed }}"
          title: "docs: tested with Pipecat v${{ needs.check.outputs.installed }}"
          body: |
            The weekly compatibility check ran the tests against pipecat-ai
            ${{ needs.check.outputs.installed }} and they passed, so the README now says the
            package was tested with it.

            Nothing else changed. The check does not raise the `pipecat-ai` floor in
            `pyproject.toml`.
